---
- name: Check whether this control-plane node has an admin kubeconfig
  ansible.builtin.stat:
    path: /etc/kubernetes/admin.conf
  register: kubeadm_admin_conf

- name: Create kubeconfig directory for the SSM operator
  ansible.builtin.file:
    path: /home/ssm-user/.kube
    state: directory
    owner: ssm-user
    group: ssm-user
    mode: "0700"
  when: kubeadm_admin_conf.stat.exists

- name: Install admin kubeconfig for the SSM operator
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: /home/ssm-user/.kube/config
    remote_src: true
    owner: ssm-user
    group: ssm-user
    mode: "0600"
  when: kubeadm_admin_conf.stat.exists
  no_log: true