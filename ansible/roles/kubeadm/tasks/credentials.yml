---
- name: Create a temporary kubeconfig for direct local API access
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: /etc/kubernetes/admin-local.conf
    remote_src: true
    owner: root
    group: root
    mode: "0600"

- name: Point the temporary kubeconfig at this node's private API address
  ansible.builtin.replace:
    path: /etc/kubernetes/admin-local.conf
    regexp: '(?m)^(\s*server:\s*)\S+$'
    replace: '\g<1>https://{{ private_ip_address }}:6443'

- name: Create a short-lived kubeadm discovery command
  ansible.builtin.command:
    argv:
      - timeout
      - 90s
      - kubeadm
      - token
      - create
      - --ttl
      - 1h
      - --kubeconfig=/etc/kubernetes/admin-local.conf
  register: kubeadm_join_result
  changed_when: true
  no_log: true

- name: Compute the kubeadm CA discovery hash
  ansible.builtin.shell:
    cmd: >-
      openssl x509 -pubkey -in /etc/kubernetes/pki/ca.crt |
      openssl rsa -pubin -outform DER 2>/dev/null |
      sha256sum | cut -d' ' -f1
    executable: /bin/bash
  register: kubeadm_ca_hash
  changed_when: false

- name: Upload control-plane certificates for joining nodes
  ansible.builtin.command:
    argv:
      - timeout
      - 90s
      - kubeadm
      - init
      - phase
      - upload-certs
      - --upload-certs
      - --kubeconfig=/etc/kubernetes/admin-local.conf
  register: kubeadm_certificate_result
  changed_when: true
  no_log: true

- name: Keep temporary join material in controller memory only
  ansible.builtin.set_fact:
    kubeadm_join_endpoint: "{{ kubernetes_api_endpoint }}"
    kubeadm_join_token: "{{ kubeadm_join_result.stdout | trim }}"
    kubeadm_discovery_hash: "sha256:{{ kubeadm_ca_hash.stdout | trim }}"
    kubeadm_certificate_key: "{{ kubeadm_certificate_result.stdout | regex_search('(?m)^[0-9a-f]{64}$') }}"
  delegate_to: localhost
  delegate_facts: true
  no_log: true

- name: Verify the certificate upload returned a key
  ansible.builtin.assert:
    that:
      - hostvars['localhost'].kubeadm_join_token is match('^[a-z0-9]{6}\.[a-z0-9]{16}$')
      - hostvars['localhost'].kubeadm_discovery_hash is match('^sha256:[a-f0-9]{64}$')
      - hostvars['localhost'].kubeadm_certificate_key | length == 64
    fail_msg: kubeadm did not return a valid temporary certificate key.
  no_log: true
