---
- name: Check whether this worker has joined
  ansible.builtin.stat:
    path: /etc/kubernetes/kubelet.conf
  register: kubelet_config

- name: Report whether this worker needs to join
  ansible.builtin.debug:
    msg: "{{ inventory_hostname }}: {{ 'already joined; kubelet.conf exists, skipping' if kubelet_config.stat.exists else 'not joined; running kubeadm join as root' }}"

- name: Join this worker only when not already joined
  ansible.builtin.command:
    argv:
      - kubeadm
      - join
      - "{{ hostvars['localhost'].kubeadm_join_endpoint }}"
      - --token
      - "{{ hostvars['localhost'].kubeadm_join_token }}"
      - --discovery-token-ca-cert-hash
      - "{{ hostvars['localhost'].kubeadm_discovery_hash }}"
      - --cri-socket
      - unix:///run/containerd/containerd.sock
  become: true
  when: not kubelet_config.stat.exists
  changed_when: true
  no_log: true
