name: Deploy and configure nonprod

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Deploy infrastructure or configure existing nodes
        required: true
        type: choice
        options:
          - deploy
          - configure
        default: deploy

permissions:
  contents: read
  id-token: write

concurrency:
  group: nonprod-lifecycle
  cancel-in-progress: false

jobs:
  deploy-and-configure:
    runs-on: ubuntu-latest
    environment: nonprod
    env:
      AWS_REGION: us-east-1
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_admin_cidr: ${{ vars.NONPROD_ADMIN_CIDR }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::982468346394:role/self-managed-kubernetes-setup
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: nonprod-k8s-${{ github.run_id }}

      - name: Verify AWS account and state bucket versioning
        shell: bash
        run: |
          set -euo pipefail
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          [[ "$account_id" == "982468346394" ]] || {
            echo "::error::OIDC role resolved to unexpected AWS account $account_id"
            exit 1
          }
          versioning="$(aws s3api get-bucket-versioning \
            --bucket terraform-statefile-srinivasa \
            --query Status --output text)"
          [[ "$versioning" == "Enabled" ]] || {
            echo "::error::Enable S3 bucket versioning before using it for Terraform state."
            exit 1
          }

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.7
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive Environments/nonprod/terraform

      - name: Initialize Terraform backend
        working-directory: Environments/nonprod/terraform
        run: terraform init -input=false

      - name: Validate Terraform
        working-directory: Environments/nonprod/terraform
        run: terraform validate

      - name: Require the nonprod administrator CIDR for deploys
        if: inputs.operation == 'deploy'
        env:
          NONPROD_ADMIN_CIDR: ${{ vars.NONPROD_ADMIN_CIDR }}
        shell: bash
        run: |
          if [[ -z "$NONPROD_ADMIN_CIDR" ]]; then
            echo "::error::Set NONPROD_ADMIN_CIDR in the nonprod GitHub Environment (for example, your trusted public IP with /32)."
            exit 1
          fi

      - name: Plan infrastructure
        if: inputs.operation == 'deploy'
        working-directory: Environments/nonprod/terraform
        run: terraform plan -input=false -out="$RUNNER_TEMP/nonprod.tfplan"

      - name: Apply infrastructure
        if: inputs.operation == 'deploy'
        working-directory: Environments/nonprod/terraform
        run: terraform apply -input=false -auto-approve "$RUNNER_TEMP/nonprod.tfplan"

      - name: Export cluster endpoint and SSM transfer bucket
        working-directory: Environments/nonprod/terraform
        shell: bash
        run: |
          set -euo pipefail
          nodes="$(terraform output -json nodes)"
          control_plane_private_ip="$(jq -er '."control-plane".private_ip' <<< "$nodes")"
          endpoint="${control_plane_private_ip}:6443"
          public_endpoint="$(terraform output -raw control_plane_api_endpoint)"
          bucket="$(terraform output -raw ansible_ssm_bucket_name)"
          [[ "$endpoint" =~ ^[A-Za-z0-9.-]+:6443$ ]] || {
            echo "::error::Unexpected internal Kubernetes API endpoint format."
            exit 1
          }
          [[ "$public_endpoint" =~ ^[A-Za-z0-9.-]+:6443$ ]] || {
            echo "::error::Unexpected public Kubernetes API endpoint format."
            exit 1
          }
          [[ "$bucket" =~ ^[a-z0-9.-]{3,63}$ ]] || {
            echo "::error::Unexpected SSM transfer bucket name."
            exit 1
          }
          {
            echo "KUBERNETES_API_ENDPOINT=$endpoint"
            echo "KUBERNETES_PUBLIC_API_ENDPOINT=$public_endpoint"
            echo "ANSIBLE_SSM_BUCKET_NAME=$bucket"
          } >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ansible/requirements.txt

      - name: Set up Ansible controller
        run: |
          python -m venv "$RUNNER_TEMP/ansible-venv"
          echo "$RUNNER_TEMP/ansible-venv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/ansible-venv/bin/python" -m pip install --disable-pip-version-check -r ansible/requirements.txt
          "$RUNNER_TEMP/ansible-venv/bin/ansible-galaxy" collection install -r ansible/requirements.yml
          curl -fsSL \
            https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb \
            -o "$RUNNER_TEMP/session-manager-plugin.deb"
          sudo dpkg -i "$RUNNER_TEMP/session-manager-plugin.deb"

      - name: Wait for all nonprod nodes to be online in SSM
        shell: bash
        run: |
          set -euo pipefail
          ids="$(aws ec2 describe-instances \
            --filters \
              Name=tag:Environment,Values=nonprod \
              Name=tag:Project,Values=self-managed-k8s \
              Name=instance-state-name,Values=running \
            --query 'Reservations[].Instances[].InstanceId' \
            --output text)"
          read -r -a instances <<< "$ids"
          [[ "${#instances[@]}" -eq 3 ]] || {
            echo "::error::Expected one control plane and two workers; found ${#instances[@]} running tagged instances."
            exit 1
          }
          for attempt in $(seq 1 36); do
            online=0
            for instance in "${instances[@]}"; do
              status="$(aws ssm describe-instance-information \
                --filters "Key=InstanceIds,Values=$instance" \
                --query 'InstanceInformationList[0].PingStatus' \
                --output text)"
              [[ "$status" == "Online" ]] && ((online += 1)) || true
            done
            [[ "$online" -eq 3 ]] && exit 0
            sleep 10
          done
          echo "::error::Not all nonprod nodes became SSM-online within six minutes."
          exit 1

      - name: Verify role-based dynamic inventory
        working-directory: ansible
        shell: bash
        run: |
          set -euo pipefail
          inventory="$(ansible-inventory -i inventory/nonprod.aws_ec2.yml --list)"
          control_planes="$(python -c 'import json,sys; print(len(json.load(sys.stdin)["control_plane"]["hosts"]))' <<< "$inventory")"
          workers="$(python -c 'import json,sys; print(len(json.load(sys.stdin)["workers"]["hosts"]))' <<< "$inventory")"
          [[ "$control_planes" -eq 1 && "$workers" -eq 2 ]] || {
            echo "::error::Inventory must contain exactly one control plane and two workers."
            exit 1
          }

      - name: Validate Ansible playbook syntax
        working-directory: ansible
        run: ansible-playbook -i inventory/nonprod.aws_ec2.yml site.yml -e @environments/nonprod.yml --syntax-check

      - name: Configure Kubernetes
        working-directory: ansible
        run: ansible-playbook -i inventory/nonprod.aws_ec2.yml site.yml -e @environments/nonprod.yml
