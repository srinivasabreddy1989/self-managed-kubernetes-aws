name: Destroy production

on:
  workflow_dispatch:
    inputs:
      operation:
        description: First review a plan, then confirm destruction
        required: true
        type: choice
        options:
          - plan
          - destroy
        default: plan
      confirmation:
        description: For destroy, enter exactly 'destroy production'
        required: false
        type: string
      plan_digest:
        description: Digest printed by the reviewed plan run; required for destroy
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: prod-lifecycle
  cancel-in-progress: false

jobs:
  destroy:
    runs-on: ubuntu-latest
    environment: prod
    env:
      AWS_REGION: us-east-1
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
    steps:
      - name: Check destruction confirmation
        if: inputs.operation == 'destroy'
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          PLAN_DIGEST: ${{ inputs.plan_digest }}
        shell: bash
        run: |
          [[ "$CONFIRMATION" == "destroy production" ]] || {
            echo "::error::Type the exact confirmation 'destroy production'."
            exit 1
          }
          [[ "$PLAN_DIGEST" =~ ^[a-f0-9]{64}$ ]] || {
            echo "::error::Provide the 64-character digest from a reviewed plan run."
            exit 1
          }

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::982468346394:role/self-managed-kubernetes-setup
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: prod-destroy-${{ github.run_id }}

      - name: Verify AWS account and state bucket versioning
        shell: bash
        run: |
          set -euo pipefail
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          [[ "$account_id" == "982468346394" ]] || {
            echo "::error::OIDC role resolved to unexpected AWS account $account_id"
            exit 1
          }
          versioning="$(aws s3api get-bucket-versioning \
            --bucket terraform-statefile-srinivasa \
            --query Status --output text)"
          [[ "$versioning" == "Enabled" ]] || {
            echo "::error::Enable S3 bucket versioning before using it for Terraform state."
            exit 1
          }

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.7
          terraform_wrapper: false

      - name: Initialize production Terraform backend
        working-directory: Environments/prod
        run: terraform init -input=false

      - name: Create and review production destroy plan
        if: inputs.operation == 'plan'
        working-directory: Environments/prod
        shell: bash
        run: |
          set -euo pipefail
          plan="$RUNNER_TEMP/prod-destroy.tfplan"
          terraform plan -destroy -input=false -out="$plan"
          plan_json="$(terraform show -json "$plan")"
          changes="$(jq '[.resource_changes[] | select(.change.actions != ["no-op"])] | length' <<< "$plan_json")"
          [[ "$changes" -gt 0 ]] || {
            echo "::error::The production state has no resources to destroy."
            exit 1
          }
          summary="$(jq -r '.resource_changes[] | select(.change.actions | index("delete")) | "\(.address) [\(.change.actions | join(","))]"' <<< "$plan_json")"
          digest_payload="$(jq -cS '[.resource_changes[] | select(.change.actions != ["no-op"]) | {address: .address, actions: .change.actions}]' <<< "$plan_json")"
          digest="$(printf '%s' "$digest_payload" | sha256sum | cut -d' ' -f1)"
          echo "Planned resources to change: $changes"
          printf '%s\n' "$summary"
          echo "Plan digest: $digest"

      - name: Confirm reviewed plan, disable NLB protection, and destroy
        if: inputs.operation == 'destroy'
        working-directory: Environments/prod
        env:
          EXPECTED_DIGEST: ${{ inputs.plan_digest }}
        shell: bash
        run: |
          set -euo pipefail
          initial_plan="$RUNNER_TEMP/prod-destroy-reviewed.tfplan"
          terraform plan -destroy -input=false -out="$initial_plan"
          initial_json="$(terraform show -json "$initial_plan")"
          initial_changes="$(jq '[.resource_changes[] | select(.change.actions != ["no-op"])] | length' <<< "$initial_json")"
          [[ "$initial_changes" -gt 0 ]] || {
            echo "::error::The production state has no resources to destroy."
            exit 1
          }
          initial_payload="$(jq -cS '[.resource_changes[] | select(.change.actions != ["no-op"]) | {address: .address, actions: .change.actions}]' <<< "$initial_json")"
          initial_digest="$(printf '%s' "$initial_payload" | sha256sum | cut -d' ' -f1)"
          [[ "$EXPECTED_DIGEST" == "$initial_digest" ]] || {
            echo "::error::The production destroy plan changed since review; rerun plan and review its digest."
            exit 1
          }

          terraform apply -input=false -auto-approve \
            -target=module.load_balancer.aws_lb.kubernetes_api \
            -var='enable_nlb_deletion_protection=false'

          final_plan="$RUNNER_TEMP/prod-destroy.tfplan"
          terraform plan -destroy -input=false \
            -var='enable_nlb_deletion_protection=false' \
            -out="$final_plan"
          final_json="$(terraform show -json "$final_plan")"
          final_payload="$(jq -cS '[.resource_changes[] | select(.change.actions != ["no-op"]) | {address: .address, actions: .change.actions}]' <<< "$final_json")"
          final_digest="$(printf '%s' "$final_payload" | sha256sum | cut -d' ' -f1)"
          [[ "$EXPECTED_DIGEST" == "$final_digest" ]] || {
            echo "::error::The production destroy actions changed after disabling NLB protection; stop and review the new plan."
            exit 1
          }
          terraform apply -input=false -auto-approve "$final_plan"
