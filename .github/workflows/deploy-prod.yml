name: Deploy and configure production

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Deploy infrastructure or configure existing nodes
        required: true
        type: choice
        options:
          - deploy
          - configure
        default: deploy

permissions:
  contents: read
  id-token: write

concurrency:
  group: prod-lifecycle
  cancel-in-progress: false

jobs:
  deploy-and-configure:
    runs-on: ubuntu-latest
    environment: prod
    env:
      AWS_REGION: us-east-1
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::982468346394:role/self-managed-kubernetes-setup
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: prod-k8s-${{ github.run_id }}

      - name: Verify AWS account and state bucket versioning
        shell: bash
        run: |
          set -euo pipefail
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          [[ "$account_id" == "982468346394" ]] || {
            echo "::error::OIDC role resolved to unexpected AWS account $account_id"
            exit 1
          }
          versioning="$(aws s3api get-bucket-versioning \
            --bucket terraform-statefile-srinivasa \
            --query Status --output text)"
          [[ "$versioning" == "Enabled" ]] || {
            echo "::error::Enable S3 bucket versioning before using it for Terraform state."
            exit 1
          }

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.7
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive Environments/prod

      - name: Initialize Terraform backend
        working-directory: Environments/prod
        run: terraform init -input=false

      - name: Validate Terraform
        working-directory: Environments/prod
        run: terraform validate

      - name: Plan production infrastructure
        if: inputs.operation == 'deploy'
        working-directory: Environments/prod
        run: terraform plan -input=false -out="$RUNNER_TEMP/prod.tfplan"

      - name: Apply production infrastructure
        if: inputs.operation == 'deploy'
        working-directory: Environments/prod
        run: terraform apply -input=false -auto-approve "$RUNNER_TEMP/prod.tfplan"

      - name: Export private API endpoint and SSM transfer bucket
        working-directory: Environments/prod
        shell: bash
        run: |
          set -euo pipefail
          nlb_dns="$(terraform output -raw kubernetes_api_endpoint)"
          endpoint="${nlb_dns}:6443"
          bucket="$(terraform output -raw ansible_ssm_bucket_name)"
          [[ "$nlb_dns" =~ ^[A-Za-z0-9.-]+$ ]] || {
            echo "::error::Unexpected production NLB DNS name."
            exit 1
          }
          [[ "$bucket" =~ ^[a-z0-9.-]{3,63}$ ]] || {
            echo "::error::Unexpected production SSM transfer bucket name."
            exit 1
          }
          {
            echo "KUBERNETES_API_ENDPOINT=$endpoint"
            echo "ANSIBLE_SSM_BUCKET_NAME=$bucket"
          } >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ansible/requirements.txt

      - name: Set up Ansible controller
        run: |
          python -m venv "$RUNNER_TEMP/ansible-venv"
          echo "$RUNNER_TEMP/ansible-venv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/ansible-venv/bin/python" -m pip install --disable-pip-version-check -r ansible/requirements.txt
          "$RUNNER_TEMP/ansible-venv/bin/ansible-galaxy" collection install -r ansible/requirements.yml
          curl -fsSL \
            https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb \
            -o "$RUNNER_TEMP/session-manager-plugin.deb"
          sudo dpkg -i "$RUNNER_TEMP/session-manager-plugin.deb"

      - name: Wait for all production nodes to be online in SSM
        shell: bash
        run: |
          set -euo pipefail
          ids="$(aws ec2 describe-instances \
            --filters \
              Name=tag:Environment,Values=production \
              Name=tag:Project,Values=kubernetes \
              Name=instance-state-name,Values=running \
            --query 'Reservations[].Instances[].InstanceId' \
            --output text)"
          read -r -a instances <<< "$ids"
          [[ "${#instances[@]}" -eq 6 ]] || {
            echo "::error::Expected three control planes and three workers; found ${#instances[@]} running tagged instances."
            exit 1
          }
          for attempt in $(seq 1 36); do
            online=0
            for instance in "${instances[@]}"; do
              status="$(aws ssm describe-instance-information \
                --filters "Key=InstanceIds,Values=$instance" \
                --query 'InstanceInformationList[0].PingStatus' \
                --output text)"
              [[ "$status" == "Online" ]] && ((online += 1)) || true
            done
            [[ "$online" -eq 6 ]] && exit 0
            sleep 10
          done
          echo "::error::Not all production nodes became SSM-online within six minutes."
          exit 1

      - name: Verify role-based dynamic inventory
        working-directory: ansible
        shell: bash
        run: |
          set -euo pipefail
          inventory="$(ansible-inventory -i inventory/prod.aws_ec2.yml --list)"
          control_planes="$(python -c 'import json,sys; print(len(json.load(sys.stdin)["control_plane"]["hosts"]))' <<< "$inventory")"
          workers="$(python -c 'import json,sys; print(len(json.load(sys.stdin)["workers"]["hosts"]))' <<< "$inventory")"
          [[ "$control_planes" -eq 3 && "$workers" -eq 3 ]] || {
            echo "::error::Inventory must contain exactly three control planes and three workers."
            exit 1
          }

      - name: Validate production Ansible playbook syntax
        working-directory: ansible
        run: ansible-playbook -i inventory/prod.aws_ec2.yml site.yml -e @environments/prod.yml --syntax-check

      - name: Configure production Kubernetes
        working-directory: ansible
        run: ansible-playbook -i inventory/prod.aws_ec2.yml site.yml -e @environments/prod.yml
